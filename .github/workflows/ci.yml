name: 🔨CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Node comes from .mise.toml (node 26) — pinned local↔CI parity,
      # not the moving `node-version: latest`. SHA matches the
      # portfolio-canonical pin (puml2drawio / ibm-wm).
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: |
          ./setup.sh
          npm ci
      - name: Lint
        run: |
          npm run lint
          npm run mdlint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: |
          ./setup.sh
          npm ci
      # Deterministic gallery drift gate (no java/docker): the .drawio
      # XML IS catalyst's emit output; if it differs from the committed
      # docs/gallery copies an emit/template change shipped without
      # refreshing the gallery (the P4b-class stale-artifact defect —
      # the converter was fixed but the public gallery still advertised
      # the old output). Failure ⇒ run `make gallery` and commit.
      - name: Gallery drift gate
        run: |
          npm run build
          GALLERY_DRAWIO_ONLY=1 node scripts/gallery.mjs
          git diff --exit-code -- docs/gallery/drawio \
            || { echo "::error::docs/gallery is STALE vs the current emit — run 'make gallery' and commit the refresh"; exit 1; }
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
        if: always()
        with:
          name: 'Coverage Report'
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
          vite-config-path: './vitest.config.ts'
