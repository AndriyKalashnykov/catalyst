name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal at workflow level. `pull-requests: read` is required by
# dorny/paths-filter on pull_request events (its listFiles() API call
# 403s without it, failing the whole changes job). The `test` job
# elevates to `pull-requests: write` locally for the coverage comment.
permissions:
  contents: read
  pull-requests: read

# Every job calls a Makefile target — the Makefile is the single source
# of truth, so `make ci` locally and CI cannot drift. Each `make
# <target>` chains its `deps` prerequisite (idempotent `mise install`
# — mise-action already populated it — + `npm ci`).

jobs:
  # Path-filter detector (portfolio-mandatory). Doc-only pushes/PRs skip
  # the heavy jobs; ci-pass still goes green (skipped ≠ failure) so a
  # Ruleset/branch-protection required check on ci-pass clears. Tag
  # pushes force code=true (a tag commonly == main HEAD → empty diff →
  # would otherwise skip every job and "release" nothing).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs.code }}
      # render-gate (make arrowskew) is the draw.io render-truth contract.
      # Narrower than `code`: it only needs re-running when the emit, the
      # render/gate scripts, the puml corpus, or the committed gallery
      # change. Tag pushes force it (same rationale as `code`).
      render: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs.render }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          # Set only on push (act's synthesized push event omits
          # repository.default_branch, which the action otherwise needs);
          # on pull_request the action uses PR.base.ref and IGNORES base
          # (an unconditional base also emits a "base ignored" annotation
          # on every PR run).
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          filters: |
            code:
              - '!(**.md|docs/**|specs/**|LICENSE|.gitignore|.claudeignore|.claude/**|benchmarks/**|**.png|**.jpg|**.gif|**.svg)'
              - 'CLAUDE.md'
            render:
              - 'src/**'
              - 'scripts/**'
              - 'tests/fixtures/**'
              - 'docs/gallery/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  static-check:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Node + act/gitleaks/trivy/java come from .mise.toml — pinned
      # local↔CI parity. SHA is the portfolio-canonical pin.
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Static check
        run: make static-check

  build:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Build
        run: make build

  test:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # davelosert/vitest-coverage-report-action comment
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      # gallery-verify + seq-gallery-verify + c4feat-gallery-verify =
      # deterministic .drawio drift gates (the .drawio XML IS catalyst's
      # C4 / seq / C4-feature emit; drift ⇒ run the matching
      # `make *-gallery` + commit). coverage-check = vitest with the
      # 85% threshold. One make invocation so deps/build runs once.
      - name: Gallery drift gates and coverage
        run: make gallery-verify seq-gallery-verify c4feat-gallery-verify coverage-check
      # (The dual-engine `LAYOUT_ENGINE=elk` step was removed with the
      # ELK engine itself — FU1 / ADR 0014. `dot` is the only engine,
      # exercised by `coverage-check` above.)
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
        if: always()
        with:
          name: 'Coverage Report'
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
          vite-config-path: './vitest.config.ts'

  # Render-truth contract: regenerate the gallery .drawio (pure node)
  # then render each via the pinned drawio-export Docker image to SVG and
  # assert no arrowhead skew / feeder occlusion. This is the deterministic
  # safety net for the #107 false-green class (an orthogonalEdgeStyle
  # re-route the EMITTED waypoints can't reveal — only draw.io's REAL
  # render can). `make factcheck` is NOT in CI: its PlantUML ground-truth
  # is host-JVM-rendered and host-font-dependent, so `ratioBad` is not
  # runner-portable — it is a host-JVM MANUAL gate. Docker-pinning it
  # was attempted 2026-05-18 and empirically closed (the only portable
  # image renders a noisier oracle than the ADR-0010 calibration host;
  # see CLAUDE.md backlog item 1 / open-followups). arrowskew has no
  # such issue: draw.io renders inside a pinned image, byte-portable.
  render-gate:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.render == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      # ubuntu-latest ships Docker; arrowskew renders the gallery .drawio
      # via the Renovate-pinned rlespinasse/drawio-export image.
      - name: Arrowskew
        run: make arrowskew

  # Single stable required check for branch-protection / Rulesets.
  # `skipped` (doc-only) is treated as pass; only `failure`/`cancelled`
  # fail the gate. Jobs can be added/renamed without touching Settings.
  ci-pass:
    if: always()
    needs: [changes, static-check, build, test, render-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"; exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"; exit 1
          fi
          echo "All required jobs passed or were skipped."
