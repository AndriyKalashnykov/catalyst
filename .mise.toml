# mise — portfolio-mandatory cross-language version manager.
# Single source of truth for every tool the Makefile drives: local dev
# and CI (jdx/mise-action) read this same file. Versions verified to
# exist via `mise ls-remote` before pinning (no guessed tags).
#
# Renovate tracks this file via its NATIVE `mise` manager (renovate.json
# `enabledManagers` includes "mise") — it understands aqua/core pins
# directly, so NO `# renovate:` inline comments belong here (those are
# only for the Makefile custom.regex manager).
[tools]
# Node — the language toolchain for the build/test path (TypeScript +
# vitest). Tracks the latest Node 26.x, mirroring CI's mise-action so
# local and CI run the same major.
node = "26"

# Java — runtime for the LOCAL render path only (`make factcheck` /
# `gallery` / `render-compare` run `java -jar plantuml.jar` for the
# PlantUML -tsvg ground truth). catalyst has zero .java source; any
# modern LTS JRE works. mise core `java` plugin (Temurin 21 LTS, tag
# verified via `mise ls-remote java`). Not needed for build/lint/
# test/CI — those are Node-only.
java = "temurin-21.0.11+10.0.LTS"

# act — runs the real ci.yml locally (`make ci-run`). Was previously
# claimed "mise-managed" by the Makefile but never declared here, so a
# fresh checkout hit `act: command not found`. aqua backend = precompiled
# release binary (faster than cargo/go install).
"aqua:nektos/act" = "0.2.89"

# gitleaks — `make secrets` (leaked-credential scan; static-check gate).
"aqua:gitleaks/gitleaks" = "8.30.1"

# trivy — `make trivy-fs` (vuln/secret/misconfig scan; static-check gate).
"aqua:aquasecurity/trivy" = "0.71.1"
